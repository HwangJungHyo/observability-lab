# Add to scripts/mimir-compose.sh with -f compose.k6.yaml.
services:
  k6:
    image: grafana/k6:1.3.0
    profiles: [load]
    entrypoint: [k6]
    working_dir: /results
    cpus: 1.0
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      BASE_URL: http://order-api:8080
    volumes:
      - ./scripts/k6-orders.js:/scripts/k6-orders.js:ro
      - ./.local/k6-results:/results
    networks: [default]
