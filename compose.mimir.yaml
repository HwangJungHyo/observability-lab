# Include after the existing four Compose files and image-lock override.
services:
  object-store:
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    platform: linux/amd64
    command: ["mini", "-dir=/data", "-ip=object-store", "-webdav=false", "-admin.ui=false", "-master.telemetry=false"]
    environment:
      AWS_ACCESS_KEY_ID: ${MIMIR_S3_ACCESS_KEY:?Run prepare-mimir-stack.sh}
      AWS_SECRET_ACCESS_KEY: ${MIMIR_S3_SECRET_KEY:?Run prepare-mimir-stack.sh}
      S3_BUCKET: mimir-lab
    volumes:
      - mimir-object-data:/data
    networks: [mimir-storage]
    cpus: 1.0
    mem_limit: 2g
    restart: unless-stopped
    logging:
      options: {max-size: "10m", max-file: "3"}

  mimir:
    image: ${MIMIR_IMAGE:?Run prepare-mimir-stack.sh}
    platform: linux/amd64
    command: ["-config.file=/etc/mimir/mimir.yaml", "-config.expand-env=true"]
    environment:
      MIMIR_S3_ACCESS_KEY: ${MIMIR_S3_ACCESS_KEY:?Run prepare-mimir-stack.sh}
      MIMIR_S3_SECRET_KEY: ${MIMIR_S3_SECRET_KEY:?Run prepare-mimir-stack.sh}
    volumes:
      - ./mimir/mimir.yaml:/etc/mimir/mimir.yaml:ro
      - mimir-data:/data
    ports:
      - "127.0.0.1:9009:9009"
    networks: [default, mimir-storage]
    cpus: 2.0
    mem_limit: 4g
    restart: unless-stopped
    logging:
      options: {max-size: "10m", max-file: "3"}

  mimir-check:
    image: ${MIMIR_CHECK_IMAGE:?Run prepare-mimir-stack.sh}
    platform: linux/amd64
    profiles: [checks]
    entrypoint: ["python", "-B", "/checks/check_mimir_storage.py"]
    environment:
      AWS_ACCESS_KEY_ID: ${MIMIR_S3_ACCESS_KEY:?Run prepare-mimir-stack.sh}
      AWS_SECRET_ACCESS_KEY: ${MIMIR_S3_SECRET_KEY:?Run prepare-mimir-stack.sh}
    volumes:
      - ./scripts/check_mimir_storage.py:/checks/check_mimir_storage.py:ro
    networks: [mimir-storage]
    read_only: true
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 0.5
    mem_limit: 128m

volumes:
  mimir-data:
  mimir-object-data:

networks:
  mimir-storage:
    internal: true
