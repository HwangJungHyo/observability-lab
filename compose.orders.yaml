# Use together with compose.yaml; local synthetic services only.
services:
  payment:
    build: ./services/order-lab
    environment:
      SERVICE_NAME: payment
      PORT: "8081"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
  order-api:
    build: ./services/order-lab
    environment:
      SERVICE_NAME: order-api
      PORT: "8080"
      PAYMENT_URL: http://payment:8081/payments
      PAYMENT_TIMEOUT_SECONDS: "2"
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      payment:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
