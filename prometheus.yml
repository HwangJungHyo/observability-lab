global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: windows
    static_configs:
      - targets: ["host.docker.internal:9182"]
        labels:
          environment: lab

  - job_name: order-api
    static_configs:
      - targets: ["order-api:8080"]
        labels:
          environment: lab

  - job_name: payment
    static_configs:
      - targets: ["payment:8081"]
        labels:
          environment: lab

  - job_name: mimir
    static_configs:
      - targets: ["mimir:9009"]
        labels:
          environment: lab

remote_write:
  - name: mimir_lab
    url: http://mimir:9009/api/v1/push
    headers:
      X-Scope-OrgID: lab
